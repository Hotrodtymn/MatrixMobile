plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.heymatrix'
version = '0.1.0'
android {
  namespace 'expo.modules.heymatrix'
  defaultConfig { versionCode 1; versionName '0.1.0' }
  consumerProguardFiles 'consumer-rules.pro'
}
// Named flat-directory dependency avoids embedding a direct AAR file dependency in a library.
rootProject.allprojects {
  repositories { flatDir { dirs new File(rootProject.projectDir, '../modules/hey-matrix/android/libs') } }
}
dependencies {
  implementation(name: 'sherpa-onnx-2.0.1', ext: 'aar')
  implementation 'androidx.core:core-ktx:1.17.0'
  testImplementation 'junit:junit:4.13.2'
}
